services:
  db:
    image: postgres:16
    container_name: reserveit-db
    environment:
      POSTGRES_DB: reserveit
      POSTGRES_USER: reserveit
      POSTGRES_PASSWORD: reserveit
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  mailpit:
    image: axllent/mailpit
    container_name: reserveit-mail
    ports:
      - "1025:1025"   # SMTP, tu aplikacja wysyła maile
      - "8025:8025"   # panel w przegladarce
volumes:
  pgdata: